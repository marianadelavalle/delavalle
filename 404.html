<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script>
  // GitHub Pages SPA redirect trick
  // Encodes the path and redirects to index.html with it as a query param
  var path = window.location.pathname + window.location.search + window.location.hash;
  window.location.replace('/?' + encodeURIComponent(path));
</script>
</head>
<body></body>
</html>
