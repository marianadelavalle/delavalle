<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script>
  var l = window.location;
  var path = l.pathname + l.search;
  // Only redirect if it's a real path (not root)
  if(path && path !== '/' && path !== '/index.html'){
    l.replace('/' + '?p=' + encodeURIComponent(path) + (l.hash || ''));
  } else {
    l.replace('/');
  }
</script>
</head>
<body></body>
</html>
